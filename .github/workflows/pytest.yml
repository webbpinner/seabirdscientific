name: Pytest

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  # A new push to a PR cancels its superseded run. Pushes to main get a group per commit,
  # because GitHub keeps only one pending run per group and would otherwise drop queued runs
  group: pytest-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One Python version on the other platforms catches OS-specific behavior (paths,
        # encodings, floating point) without multiplying the matrix
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    # bash on every OS, including Windows, so run steps behave the same everywhere
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Coverage is shown in the job's log, and as a table on the job's summary page
      - name: Run pytest
        run: uv run pytest --cov=seabirdscientific --cov-report=term-missing:skip-covered

      # coverage's own markdown report works with every pytest-cov the dev group allows
      # (pytest-cov's markdown-append report needs 6.3 or later)
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
