name: Build and Release

on:
  # Every PR and push builds and smoke-tests the package
  pull_request:
    branches: ["**"]
  push:
    branches: [main, v3.0.0]
  # Publishing a GitHub release (including a pre-release) uploads that build to PyPI
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check release tag matches project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag = $TAG, version = $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match pyproject.toml version v$version"
            exit 1
          fi

      # uv build makes the sdist, then builds the wheel from that sdist, so files missing from
      # the sdist fail here
      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      # Install the wheel (not the source tree) into a clean environment with only the core
      # dependencies, on the oldest supported Python, and import it. This catches missing
      # modules or package data (resources/sbs_variables.json is read on import).
      - name: Smoke test the wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.11
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import seabirdscientific.cal_coefficients
          import seabirdscientific.contour
          import seabirdscientific.conversion
          import seabirdscientific.eos80_conversion
          import seabirdscientific.instrument_data
          import seabirdscientific.processing
          from seabirdscientific.interpret_sbs_variable import interpret_sbs_variable

          assert interpret_sbs_variable("tFreq")["title"] == "Temperature"
          print("wheel imports OK")
          EOF

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Requires a trusted publisher on PyPI for this repository, this workflow file and the
    # "pypi" environment. Protect the environment (e.g. required reviewers) to gate uploads.
    environment:
      name: pypi
      url: https://pypi.org/project/seabirdscientific/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    name: Attach distributions to release
    needs: [build, publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # --clobber replaces files of the same name, e.g. ones attached by hand
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
