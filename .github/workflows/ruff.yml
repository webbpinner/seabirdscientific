name: Ruff Linter

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, v3.0.0]

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml instead of re-resolving
      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check and ruff format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .